<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Celestial radial background -->
    <radialGradient id="skyVoid" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1226" />
      <stop offset="60%" stop-color="#040711" />
      <stop offset="100%" stop-color="#020307" />
    </radialGradient>

    <!-- Radiant Starlight Gold -->
    <linearGradient id="starGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#facc15" />
      <stop offset="85%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <!-- Secondary Flare Gold -->
    <linearGradient id="flareGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>

    <!-- Celestial Ring Glow -->
    <linearGradient id="ringSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c89b3c" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.75" />
      <stop offset="70%" stop-color="#c89b3c" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#facc15" stop-opacity="0.9" />
    </linearGradient>

    <!-- Magnus Core Glow -->
    <radialGradient id="magnusGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="30%" stop-color="#fef08a" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#020409" stop-opacity="0" />
    </radialGradient>

    <!-- Star Glow Filter -->
    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Cosmos Base Disc -->
  <circle cx="32" cy="32" r="30" fill="url(#skyVoid)" stroke="#c89b3c" stroke-opacity="0.5" stroke-width="1.2" />

  <!-- Outer Astrolabe Orbit Ring -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="url(#ringSheen)" stroke-width="1" stroke-dasharray="3 1.5" opacity="0.85" />

  <!-- Inner Celestial Sphere Ring -->
  <circle cx="32" cy="32" r="14" fill="none" stroke="#38bdf8" stroke-width="0.75" opacity="0.45" />

  <!-- Diamond Constellation Nodes on Ring -->
  <g fill="#fde047" opacity="0.9">
    <!-- North-East node -->
    <polygon points="48.2,15.8 49.6,17.2 48.2,18.6 46.8,17.2" />
    <!-- North-West node -->
    <polygon points="15.8,15.8 17.2,17.2 15.8,18.6 14.4,17.2" />
    <!-- South-East node -->
    <polygon points="48.2,45.4 49.6,46.8 48.2,48.2 46.8,46.8" />
    <!-- South-West node -->
    <polygon points="15.8,45.4 17.2,46.8 15.8,48.2 14.4,46.8" />
  </g>

  <!-- Subtle Constellation Link Lines -->
  <g stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.35">
    <line x1="15.8" y1="17.2" x2="48.2" y2="46.8" />
    <line x1="48.2" y1="17.2" x2="15.8" y2="46.8" />
  </g>

  <!-- Secondary Diagonal Rays (rotated 45 deg) -->
  <g transform="rotate(45 32 32)" filter="url(#starGlow)">
    <path
      d="M 32 14 Q 32.5 28 33.8 29.8 Q 36 31 48 32 Q 36 33 33.8 34.2 Q 32.5 36 32 50 Q 31.5 36 30.2 34.2 Q 28 33 16 32 Q 28 31 30.2 29.8 Q 31.5 28 32 14 Z"
      fill="url(#flareGold)"
      opacity="0.85"
    />
  </g>

  <!-- Primary Cardinal Starlight Ray Burst (North, South, East, West) -->
  <path
    d="M 32 5 Q 32.7 26 34.5 29.5 Q 38 31.3 57 32 Q 38 32.7 34.5 34.5 Q 32.7 38 32 59 Q 31.3 38 29.5 34.5 Q 26 32.7 7 32 Q 26 31.3 29.5 29.5 Q 31.3 26 32 5 Z"
    fill="url(#starGold)"
    filter="url(#starGlow)"
  />

  <!-- Brilliant Magicka Core Flare -->
  <circle cx="32" cy="32" r="9" fill="url(#magnusGlow)" />
  <circle cx="32" cy="32" r="2.8" fill="#ffffff" />
</svg>